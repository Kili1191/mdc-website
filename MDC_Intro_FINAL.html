:root{--parchemin:#EDE4D0;--rouille:#A55A3E;--brou:#4A3B2A;--sauge:#8C8B6A;}
*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;}
body{background:var(--parchemin);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Georgia,serif;color:var(--brou);position:relative;}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 46%,rgba(237,228,208,0) 56%,rgba(168,154,133,0.15) 100%);}
.stage{position:relative;width:min(82vw,410px);aspect-ratio:574/480;display:flex;align-items:center;justify-content:center;}
svg{width:100%;height:100%;overflow:visible;display:block;}
.guide{position:absolute;bottom:-13%;left:0;right:0;text-align:center;font-size:clamp(12px,3.2vw,16px);letter-spacing:.34em;text-transform:lowercase;color:var(--brou);opacity:0;font-variant:small-caps;transition:opacity .8s ease;}
.brand{position:absolute;bottom:-20%;left:50%;transform:translate(-50%,22px);white-space:nowrap;font-family:'Higuen',Georgia,serif;font-size:clamp(20px,4.4vw,32px);letter-spacing:.05em;line-height:1;color:var(--brou);opacity:0;transition:opacity 2.2s cubic-bezier(.16,1,.3,1),transform 2.2s cubic-bezier(.16,1,.3,1);}
.brand.in{opacity:1;transform:translate(-50%,0);}
.actions{position:fixed;bottom:16px;left:0;right:0;display:flex;gap:18px;justify-content:center;}
.actions button{background:none;border:none;font-family:Georgia,serif;font-size:13px;letter-spacing:.18em;color:var(--brou);opacity:.5;text-transform:lowercase;cursor:pointer;padding:6px 10px;}

<clipPath id="cLW"><rect id="rLW" x="0" y="175" width="574" height="0"/></clipPath>
<clipPath id="cBT"><rect id="rBT" x="0" y="430" width="0" height="55"/></clipPath>

<g clip-path="url(#cLW)"><g mask="url(#mLW)"><use href="#tex"/></g></g>
<g clip-path="url(#cBT)"><g mask="url(#mBT)"><use href="#tex"/></g></g>

<div class="guide" id="guide"></div><div class="brand" id="brand">Maison du Calme</div></div>
<div class="actions"><button id="bReplay">replay</button><button id="bSkip">skip</button></div>
<script>
var rLW=document.getElementById("rLW"),rBT=document.getElementById("rBT"),rRW=document.getElementById("rRW"),rRF=document.getElementById("rRF"),eyesG=document.getElementById("eyesG"),guide=document.getElementById("guide"),brand=document.getElementById("brand"),stage=document.querySelector(".stage");
// progression CONTINUE: chaque trait recoit la part de progression globale, sans jamais retomber a 0
function draw(P){ // P = progression globale 0..4 (un trait par unite)
  function seg(i){ return Math.max(0,Math.min(1,P-i)); }
  var a=seg(0);rLW.setAttribute("y",175);rLW.setAttribute("height",310*a);
  var b=seg(1);rBT.setAttribute("x",0);rBT.setAttribute("width",574*b);
  var c=seg(2);rRW.setAttribute("height",310*c);rRW.setAttribute("y",478-310*c);
  var d=seg(3);rRF.setAttribute("x",0);rRF.setAttribute("width",574*d);
}
var LAB=["inhale","exhale","inhale","exhale"];
var speed=1,loop=true,t0=null,raf=null,bh=5500;
function reset(){cancelAnimationFrame(raf);draw(0);eyesG.style.opacity=0;brand.classList.remove("in");stage.style.opacity=1;guide.style.opacity=0;t0=null;raf=requestAnimationFrame(tick);}
function tick(ts){if(t0===null)t0=ts;var t=ts-t0,T=bh/speed;
 var g=t/T;                                  // demi-souffles ecoules, en continu
 // ondulation respiratoire douce SANS jamais s'arreter (derivee toujours > 0)
 var P=g-0.16*Math.sin(2*Math.PI*g)/(2*Math.PI)*2;
 if(P<4){ draw(P); eyesG.style.opacity=0; brand.classList.remove("in");
   var hh=Math.min(3,Math.floor(g)); guide.style.opacity=.5; guide.textContent=LAB[hh];
   raf=requestAnimationFrame(tick); return; }
 // dessin fini -> yeux + nom ensemble
 var te=t-4*T;
 if(te< T){ draw(4); var f=te/T; eyesG.style.opacity=f; brand.classList.add("in"); guide.style.opacity=.5*(1-f); raf=requestAnimationFrame(tick); return; }
 if(te< 3*T){ draw(4); eyesG.style.opacity=1; brand.classList.add("in"); guide.style.opacity=0; raf=requestAnimationFrame(tick); return; }
 var ft=Math.min((te-3*T)/1600,1); stage.style.opacity=1-ft;
 if(ft>=1&&loop){reset();return;} raf=requestAnimationFrame(tick);}
document.getElementById("bReplay").onclick=function(){reset();};
document.getElementById("bSkip").onclick=function(){cancelAnimationFrame(raf);draw(4);eyesG.style.opacity=1;brand.classList.add("in");guide.style.opacity=0;t0=null;setTimeout(reset,1800);};
reset();
</script></body></html>
