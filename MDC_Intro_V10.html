<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MDC - The breath draws the house</title>
<style>
  :root{ --parchemin:#EDE4D0; --rouille:#A55A3E; --brou:#4A3B2A; --taupe:#A89A85; --sauge:#8C8B6A; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--parchemin);display:flex;align-items:center;justify-content:center;
    overflow:hidden;font-family:Georgia,serif;color:var(--brou);position:relative;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 46%, rgba(237,228,208,0) 56%, rgba(168,154,133,0.15) 100%);}
  .stage{position:relative;width:min(82vw,410px);aspect-ratio:574/480;display:flex;align-items:center;justify-content:center;}
  svg{width:100%;height:100%;overflow:visible;display:block;}
  .guide{position:absolute;bottom:-14%;left:0;right:0;text-align:center;font-size:clamp(12px,3.2vw,16px);
    letter-spacing:0.34em;text-transform:lowercase;color:var(--brou);opacity:0;font-variant:small-caps;}
  .panel{position:fixed;top:12px;right:12px;background:rgba(237,228,208,0.82);backdrop-filter:blur(4px);
    border:1px solid rgba(168,154,133,0.5);border-radius:10px;padding:10px 12px;
    font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--brou);width:188px;opacity:0.25;transition:opacity 0.3s;z-index:10;}
  .panel:hover,.panel.show{opacity:1;}
  .panel h4{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px;color:var(--sauge);font-weight:600;}
  .row{display:flex;align-items:center;justify-content:space-between;margin:7px 0;gap:8px;}
  .row label{flex:0 0 auto;opacity:0.8;}
  .row input[type=range]{flex:1;height:2px;accent-color:var(--rouille);}
  .row .val{flex:0 0 34px;text-align:right;opacity:0.6;}
  .meta{margin-top:9px;padding-top:8px;border-top:1px solid rgba(168,154,133,0.4);font-size:10px;opacity:0.7;line-height:1.5;}
  .actions{position:fixed;bottom:16px;left:0;right:0;display:flex;gap:18px;justify-content:center;z-index:10;}
  .actions button{background:none;border:none;font-family:Georgia,serif;font-size:13px;letter-spacing:0.18em;
    color:var(--brou);opacity:0.5;text-transform:lowercase;cursor:pointer;padding:6px 10px;transition:opacity 0.3s;}
  .actions button:hover{opacity:1;}
</style></head>

    <button id="bReplay">replay</button>
    <button id="bSkip">skip</button>
    <button id="bLoop">loop: on</button>
  </div>

<script>
var rLW=document.getElementById('rLW'),rBT=document.getElementById('rBT'),
    rRW=document.getElementById('rRW'),rRF=document.getElementById('rRF'),
    eyesG=document.getElementById('eyesG'),guide=document.getElementById('guide');

function wipe(h,f){
  var p0=h>0?1:(h===0?f:0); rLW.setAttribute('y',175); rLW.setAttribute('height',310*p0);
  var p1=h>1?1:(h===1?f:0); rBT.setAttribute('x',0); rBT.setAttribute('width',574*p1);
  var p2=h>2?1:(h===2?f:0); rRW.setAttribute('height',310*p2); rRW.setAttribute('y',478-310*p2);
  var p3=h>3?1:(h===3?f:0); rRF.setAttribute('x',0); rRF.setAttribute('width',574*p3);
}
function setEyes(o){ eyesG.style.opacity=o; }

var LABELS=['inhale','exhale','inhale','exhale'];
var easeIO=function(x){return -(Math.cos(Math.PI*x)-1)/2;};
var speed=1, loop=true, t0=null, raf=null;
var baseHalf=5500;
function halfMs(){ return baseHalf/speed; }

function reset(){
  cancelAnimationFrame(raf);
  wipe(0,0); setEyes(0); guide.style.opacity=0; guide.textContent='';
  t0=null; raf=requestAnimationFrame(tick);
}
function tick(ts){
  if(t0===null)t0=ts;
  var t=ts-t0,T=halfMs();
  var h=Math.floor(t/T), f=easeIO((t-h*T)/T);
  if(h<4){ wipe(h,f); setEyes(0); guide.style.opacity=0.55; guide.textContent=LABELS[h];
    raf=requestAnimationFrame(tick); return; }
  if(h===4){ wipe(4,1); setEyes(f); guide.style.opacity=0.55*(1-f); guide.textContent='';
    raf=requestAnimationFrame(tick); return; }
  wipe(4,1); setEyes(1);
  if(loop && t>=5*T+2600){ reset(); return; }
  raf=requestAnimationFrame(tick);
}

document.getElementById('cSpeed').addEventListener('input',function(e){speed=parseFloat(e.target.value);
  document.getElementById('vSpeed').textContent=(baseHalf/1000/speed).toFixed(1)+'s';});
document.getElementById('bReplay').onclick=function(){reset();};
document.getElementById('bSkip').onclick=function(){cancelAnimationFrame(raf);wipe(4,1);setEyes(1);
  guide.style.opacity=0;t0=null;if(loop)setTimeout(reset,1400);};
var bLoop=document.getElementById('bLoop');
bLoop.onclick=function(){loop=!loop;bLoop.textContent='loop: '+(loop?'on':'off');};
var panel=document.getElementById('panel');
panel.classList.add('show');setTimeout(function(){panel.classList.remove('show');},2400);
reset();
</script>
</body></html>
